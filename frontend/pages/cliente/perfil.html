<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/ProyectoFinDeGrado/frontend/favicon.png">
    <title>Mi perfil - El Olivo</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <nav id="navbar"></nav>

    <main>
        <section class="seccion-landing">
            <h2>Mi perfil</h2>

            <a href="/ProyectoFinDeGrado/frontend/index.html" class="btn btn-gris" style="display: inline-block; margin-bottom: 20px;">&larr; Volver al inicio</a>

            <div id="cargando" class="formulario">
                <p>Cargando datos...</p>
            </div>

            <form id="form-perfil" class="formulario" style="display: none;" onsubmit="guardarPerfil(event)">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="campo">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" required>
                </div>

                <div class="campo">
                    <label>Email</label>
                    <p id="email-texto" style="padding: 9px 12px; background-color: var(--gris); border: 1px solid var(--borde); border-radius: 5px; font-size: 0.95rem; color: #666;"></p>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" required>
                </div>

                <hr style="margin: 24px 0; border: none; border-top: 1px solid var(--borde);">
                <p style="font-size: 0.9rem; color: #666; margin-bottom: 16px;">Deja los campos de contraseña en blanco si no quieres cambiarla.</p>

                <div class="campo">
                    <label for="password-actual">Contraseña actual</label>
                    <input type="password" id="password-actual" name="password_actual" placeholder="Solo si quieres cambiarla">
                </div>

                <div class="campo">
                    <label for="password-nueva">Nueva contraseña</label>
                    <input type="password" id="password-nueva" name="password_nueva" placeholder="Mínimo 6 caracteres">
                </div>

                <div class="campo">
                    <label for="password-confirmar">Confirmar nueva contraseña</label>
                    <input type="password" id="password-confirmar" name="password_confirmar" placeholder="Repite la nueva contraseña">
                </div>

                <div id="mensaje-error" class="mensaje-error"></div>
                <div id="mensaje-exito" class="mensaje-exito"></div>

                <button type="submit" id="btn-guardar" class="btn btn-verde">Guardar cambios</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 El Olivo &middot; Restaurante &middot; Madrid</p>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>

    <script>
        (async function () {
            var usuario = await checkSession();
            if (!usuario) return;

            var respuesta = await fetchAPI('/ProyectoFinDeGrado/backend/usuarios/obtener_perfil.php');

            document.getElementById('cargando').style.display = 'none';

            if (!respuesta.success) {
                document.getElementById('cargando').style.display = 'block';
                document.getElementById('cargando').innerHTML = '<p style="color: var(--rojo);">No se pudieron cargar los datos del perfil.</p>';
                return;
            }

            var datos = respuesta.data;
            document.getElementById('nombre').value    = datos.nombre;
            document.getElementById('apellidos').value = datos.apellidos;
            document.getElementById('email-texto').textContent = datos.email;
            document.getElementById('telefono').value  = datos.telefono;

            document.getElementById('form-perfil').style.display = 'block';
        })();

        function guardarPerfil(e) {
            e.preventDefault();

            var mensajeError  = document.getElementById('mensaje-error');
            var mensajeExito  = document.getElementById('mensaje-exito');
            mensajeError.style.display = 'none';
            mensajeExito.style.display = 'none';

            var nombre    = document.getElementById('nombre').value.trim();
            var apellidos = document.getElementById('apellidos').value.trim();
            var telefono  = document.getElementById('telefono').value.trim();
            var passActual    = document.getElementById('password-actual').value;
            var passNueva     = document.getElementById('password-nueva').value;
            var passConfirmar = document.getElementById('password-confirmar').value;

            if (!nombre || !apellidos || !telefono) {
                mensajeError.textContent   = 'Nombre, apellidos y teléfono son obligatorios.';
                mensajeError.style.display = 'block';
                return;
            }

            if (passNueva && passNueva.length < 6) {
                mensajeError.textContent   = 'La nueva contraseña debe tener al menos 6 caracteres.';
                mensajeError.style.display = 'block';
                return;
            }

            if (passNueva && passNueva !== passConfirmar) {
                mensajeError.textContent   = 'Las contraseñas nuevas no coinciden.';
                mensajeError.style.display = 'block';
                return;
            }

            var payload = { nombre: nombre, apellidos: apellidos, telefono: telefono };
            if (passNueva) {
                payload.password_actual = passActual;
                payload.password_nueva  = passNueva;
            }

            var btn = document.getElementById('btn-guardar');
            btn.disabled = true;
            btn.textContent = 'Guardando...';

            fetchAPI('/ProyectoFinDeGrado/backend/usuarios/actualizar_perfil.php', 'POST', payload)
                .then(function (respuesta) {
                    btn.disabled = false;
                    btn.textContent = 'Guardar cambios';

                    if (respuesta.success) {
                        mensajeExito.textContent   = respuesta.message;
                        mensajeExito.style.display = 'block';
                        document.getElementById('password-actual').value    = '';
                        document.getElementById('password-nueva').value     = '';
                        document.getElementById('password-confirmar').value = '';
                    } else {
                        mensajeError.textContent   = respuesta.message;
                        mensajeError.style.display = 'block';
                    }
                });
        }
    </script>

</body>
</html>
