<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/ProyectoFinDeGrado/frontend/favicon.png">
    <title>Mi perfil — El Olivo</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <nav id="navbar" class="nav"></nav>

    <header class="page-header">
        <div class="page-header-inner">
            <div>
                <div class="eyebrow">Tu cuenta · El Olivo</div>
                <h1 class="display">Mi perfil</h1>
                <p class="subtitle">Actualiza tus datos de contacto o cambia tu contraseña.</p>
            </div>
        </div>
    </header>

    <main class="page-main" style="max-width:680px;">

        <div id="cargando" class="card card-body">
            <p style="color:var(--ink-3); font-size:13px;">Cargando datos...</p>
        </div>

        <form id="form-perfil" style="display:none;" onsubmit="guardarPerfil(event)">

            <!-- Avatar + nombre -->
            <div class="card card-body row gap-4" style="align-items:center; margin-bottom:16px;">
                <div class="perfil-avatar-circle" id="perfil-avatar">?</div>
                <div>
                    <div class="display" style="font-size:22px;" id="perfil-nombre-display">—</div>
                    <div style="font-size:13px; color:var(--ink-3);" id="perfil-email-display">—</div>
                </div>
            </div>

            <!-- Datos personales -->
            <div class="card card-body col gap-4" style="margin-bottom:16px;">
                <div class="eyebrow" style="margin-bottom:4px;">Datos personales</div>
                <div class="row gap-3">
                    <div class="field" style="flex:1;">
                        <label>Nombre</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="field" style="flex:1;">
                        <label>Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" required>
                    </div>
                </div>
                <div class="field">
                    <label>Email</label>
                    <div id="email-texto" class="input" style="display:flex;align-items:center; background:var(--bg-sunk); color:var(--ink-3); cursor:not-allowed;"></div>
                </div>
                <div class="field">
                    <label>Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" required>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="card card-body col gap-4" style="margin-bottom:16px;">
                <div class="eyebrow" style="margin-bottom:4px;">Cambiar contraseña</div>
                <p style="font-size:12px; color:var(--ink-3);">Deja los campos en blanco si no quieres cambiarla.</p>
                <div class="field">
                    <label>Contraseña actual</label>
                    <input type="password" id="password-actual" name="password_actual" placeholder="Solo si quieres cambiarla">
                </div>
                <div class="field">
                    <label>Nueva contraseña</label>
                    <input type="password" id="password-nueva" name="password_nueva" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="field">
                    <label>Confirmar nueva contraseña</label>
                    <input type="password" id="password-confirmar" name="password_confirmar" placeholder="Repite la nueva contraseña">
                </div>
            </div>

            <div id="mensaje-error" class="mensaje-error"></div>
            <div id="mensaje-exito" class="mensaje-exito"></div>

            <button type="submit" id="btn-guardar" class="btn btn-primary">Guardar cambios</button>
        </form>

    </main>

    <footer class="footer">
        <span>&copy; 2025 El Olivo · Madrid</span>
        <span class="mono" style="font-size:11px;">Cocina mediterránea</span>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>

    <script>
        (async function () {
            var usuario = await checkSession();
            if (!usuario) return;

            var respuesta = await fetchAPI('/ProyectoFinDeGrado/backend/usuarios/obtener_perfil.php');
            document.getElementById('cargando').style.display = 'none';

            if (!respuesta.success) {
                document.getElementById('cargando').style.display = 'block';
                document.getElementById('cargando').innerHTML = '<p style="color:var(--err);">No se pudieron cargar los datos del perfil.</p>';
                return;
            }

            var datos = respuesta.data;
            document.getElementById('nombre').value    = datos.nombre;
            document.getElementById('apellidos').value = datos.apellidos;
            document.getElementById('email-texto').textContent = datos.email;
            document.getElementById('telefono').value  = datos.telefono;

            var nombreCompleto = datos.nombre + ' ' + datos.apellidos;
            document.getElementById('perfil-nombre-display').textContent = nombreCompleto;
            document.getElementById('perfil-email-display').textContent  = datos.email;

            var partes = nombreCompleto.trim().split(' ');
            var ini = partes.length >= 2 ? (partes[0][0] + partes[1][0]).toUpperCase() : partes[0][0].toUpperCase();
            document.getElementById('perfil-avatar').textContent = ini;

            document.getElementById('form-perfil').style.display = 'block';
        })();

        function guardarPerfil(e) {
            e.preventDefault();

            var mensajeError  = document.getElementById('mensaje-error');
            var mensajeExito  = document.getElementById('mensaje-exito');
            mensajeError.style.display = 'none';
            mensajeExito.style.display = 'none';

            var nombre    = document.getElementById('nombre').value.trim();
            var apellidos = document.getElementById('apellidos').value.trim();
            var telefono  = document.getElementById('telefono').value.trim();
            var passActual    = document.getElementById('password-actual').value;
            var passNueva     = document.getElementById('password-nueva').value;
            var passConfirmar = document.getElementById('password-confirmar').value;

            if (!nombre || !apellidos || !telefono) {
                mensajeError.textContent   = 'Nombre, apellidos y teléfono son obligatorios.';
                mensajeError.style.display = 'block';
                return;
            }
            if (passNueva && passNueva.length < 6) {
                mensajeError.textContent   = 'La nueva contraseña debe tener al menos 6 caracteres.';
                mensajeError.style.display = 'block';
                return;
            }
            if (passNueva && passNueva !== passConfirmar) {
                mensajeError.textContent   = 'Las contraseñas nuevas no coinciden.';
                mensajeError.style.display = 'block';
                return;
            }

            var payload = { nombre: nombre, apellidos: apellidos, telefono: telefono };
            if (passNueva) {
                payload.password_actual = passActual;
                payload.password_nueva  = passNueva;
            }

            var btn = document.getElementById('btn-guardar');
            btn.disabled = true;
            btn.textContent = 'Guardando...';

            fetchAPI('/ProyectoFinDeGrado/backend/usuarios/actualizar_perfil.php', 'POST', payload)
                .then(function (respuesta) {
                    btn.disabled = false;
                    btn.textContent = 'Guardar cambios';

                    if (respuesta.success) {
                        mensajeExito.textContent   = respuesta.message;
                        mensajeExito.style.display = 'block';
                        document.getElementById('password-actual').value    = '';
                        document.getElementById('password-nueva').value     = '';
                        document.getElementById('password-confirmar').value = '';
                    } else {
                        mensajeError.textContent   = respuesta.message;
                        mensajeError.style.display = 'block';
                    }
                });
        }
    </script>

</body>
</html>
