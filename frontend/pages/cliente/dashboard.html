<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Mis reservas — Los Olivos</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <nav id="navbar" class="nav"></nav>

    <header class="page-header">
        <div class="page-header-inner">
            <div>
                <div class="eyebrow">Tu cuenta Los Olivos</div>
                <h1 class="display">Mis reservas</h1>
                <p class="subtitle">Tus reservas pasadas y futuras.</p>
            </div>
            <div class="page-actions">
                <a href="nueva_reserva.html" class="btn btn-primary">+ Nueva reserva</a>
            </div>
        </div>
    </header>

    <main class="page-main">

        <p id="sin-reservas" style="display:none; color:var(--ink-3); font-size:13px; padding:28px 0;">No tienes reservas aún.</p>

        <div class="card">
            <table id="tabla-reservas" class="tbl" style="display:none;">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Hora inicio</th>
                        <th>Hora fin</th>
                        <th>Personas</th>
                        <th>Estado</th>
                        <th style="text-align:right;">Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla"></tbody>
            </table>
        </div>

    </main>

    <footer class="footer">
        <span>&copy; 2026 Los Olivos Madrid</span>
        <span class="mono" style="font-size:11px;">Cocina mediterránea</span>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/reservas.js"></script>

    <script>
        (async function () {
            var usuario = await checkSession();
            if (!usuario) return;
            cargarReservas();
        })();
    </script>

</body>
</html>
