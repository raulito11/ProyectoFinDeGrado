<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Plato — Los Olivos Admin</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <nav id="navbar" class="nav"></nav>

    <header class="page-header">
        <div class="page-header-inner">
            <div>
                <div class="eyebrow">Administración Carta</div>
                <h1 class="display" id="titulo-pagina">Nuevo plato</h1>
            </div>
            <div class="page-actions">
                <a href="carta.html" class="btn btn-secondary btn-sm">← Volver a la carta</a>
            </div>
        </div>
    </header>

    <main class="page-main" style="max-width:680px;">

        <div id="mensaje-error" class="mensaje-error"></div>
        <div id="mensaje-exito" class="mensaje-exito"></div>

        <div class="card card-body col gap-4">
            <div class="field">
                <label>Nombre</label>
                <input type="text" id="campo-nombre" placeholder="Nombre del plato">
            </div>
            <div class="field">
                <label>Descripción</label>
                <input type="text" id="campo-descripcion" placeholder="Descripción del plato">
            </div>
            <div class="row gap-3">
                <div class="field" style="flex:1;">
                    <label>Precio (EUR)</label>
                    <input type="number" id="campo-precio" placeholder="0.00" min="0" step="0.01">
                </div>
                <div class="field" style="flex:1;">
                    <label>Estado</label>
                    <select id="campo-activo">
                        <option value="1">Activo</option>
                        <option value="0">Inactivo</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label>Destacado en la landing</label>
                <select id="campo-destacado">
                    <option value="0">No destacado</option>
                    <option value="1">Destacado (máx. 3)</option>
                </select>
                <span style="font-size:11px; color:var(--ink-3); margin-top:4px;">Los platos destacados aparecen en la página principal.</span>
            </div>
            <div class="field">
                <label>Categoría</label>
                <select id="campo-categoria">
                    <option value="">Cargando categorías...</option>
                </select>
            </div>
            <div class="field">
                <label>Imagen del plato <span style="font-weight:400; text-transform:none; letter-spacing:0; color:var(--ink-3);">(JPG, PNG, WEBP — máx. 2 MB)</span></label>
                <input type="file" id="campo-imagen" accept="image/jpeg,image/png,image/webp,image/gif" style="height:auto; padding:8px 12px;">
                <img id="preview-imagen" src="" alt="Vista previa" style="display:none; margin-top:8px; max-height:140px; border-radius:var(--r-md); border:1px solid var(--line);">
            </div>
            <div class="row gap-2">
                <button class="btn btn-primary" id="btn-guardar" onclick="guardarPlato()">Añadir plato</button>
                <a href="carta.html" class="btn btn-ghost">Cancelar</a>
            </div>
        </div>

    </main>

    <footer class="footer">
        <span>&copy; 2026 Los Olivos Madrid</span>
        <span class="mono" style="font-size:11px;">Cocina mediterránea</span>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>

    <script>
        var idPlato = null;

        checkSession().then(function (usuario) {
            if (!usuario) return;
            if (usuario.rol !== 'admin') {
                window.location.href = '/index.html';
                return;
            }
            idPlato = sessionStorage.getItem('idPlatoEditar');
            sessionStorage.removeItem('idPlatoEditar');
            cargarCategorias().then(function () {
                if (idPlato) {
                    document.getElementById('titulo-pagina').textContent = 'Editar plato';
                    document.getElementById('btn-guardar').textContent   = 'Guardar cambios';
                    cargarPlato(idPlato);
                }
            });
        });

        function cargarCategorias() {
            return fetchAPI('/ProyectoFinDeGrado/backend/carta/listar_categorias.php')
                .then(function (respuesta) {
                    var select = document.getElementById('campo-categoria');
                    select.innerHTML = '';
                    if (!respuesta.success) return;
                    respuesta.data.forEach(function (c) {
                        var option = document.createElement('option');
                        option.value       = c.id_categoria;
                        option.textContent = c.nombre;
                        select.appendChild(option);
                    });
                });
        }

        function cargarPlato(id) {
            fetchAPI('/ProyectoFinDeGrado/backend/carta/listar_platos.php')
                .then(function (respuesta) {
                    if (!respuesta.success) return;
                    var plato = null;
                    respuesta.data.forEach(function (p) { if (p.id_plato == id) plato = p; });
                    if (!plato) { window.location.href = 'carta.html'; return; }
                    document.getElementById('campo-nombre').value      = plato.nombre;
                    document.getElementById('campo-descripcion').value = plato.descripcion || '';
                    document.getElementById('campo-precio').value      = plato.precio;
                    document.getElementById('campo-categoria').value   = plato.id_categoria;
                    document.getElementById('campo-activo').value      = plato.activo;
                    document.getElementById('campo-destacado').value   = plato.destacado || 0;
                    if (plato.imagen) {
                        var preview = document.getElementById('preview-imagen');
                        preview.src = '/' + plato.imagen;
                        preview.style.display = 'block';
                    }
                });
        }

        function guardarPlato() {
            var nombre      = document.getElementById('campo-nombre').value.trim();
            var descripcion = document.getElementById('campo-descripcion').value.trim();
            var precio      = document.getElementById('campo-precio').value;
            var idCategoria = document.getElementById('campo-categoria').value;
            var activo      = document.getElementById('campo-activo').value;
            var destacado   = document.getElementById('campo-destacado').value;
            var inputImagen = document.getElementById('campo-imagen');

            if (!nombre || !precio || !idCategoria) {
                mostrarMensaje('mensaje-error', 'Nombre, precio y categoría son obligatorios.');
                return;
            }

            var formData = new FormData();
            formData.append('nombre',       nombre);
            formData.append('descripcion',  descripcion);
            formData.append('precio',       precio);
            formData.append('id_categoria', idCategoria);
            formData.append('activo',       activo);
            formData.append('destacado',    destacado);
            if (inputImagen.files.length > 0) formData.append('imagen', inputImagen.files[0]);

            var url;
            if (idPlato) {
                formData.append('id_plato', idPlato);
                url = '/ProyectoFinDeGrado/backend/carta/modificar_plato.php';
            } else {
                url = '/ProyectoFinDeGrado/backend/carta/crear_plato.php';
            }

            fetch(url, { method: 'POST', credentials: 'include', body: formData })
                .then(function (r) { return r.json(); })
                .then(function (respuesta) {
                    if (!respuesta.success) {
                        mostrarMensaje('mensaje-error', respuesta.message || 'Error al guardar el plato.');
                        return;
                    }
                    var msg = idPlato ? 'Plato actualizado correctamente.' : 'Plato creado correctamente.';
                    mostrarMensaje('mensaje-exito', msg + ' Volviendo...');
                    setTimeout(function () { window.location.href = 'carta.html'; }, 1500);
                })
                .catch(function () { mostrarMensaje('mensaje-error', 'Error de conexión con el servidor.'); });
        }

        document.getElementById('campo-imagen').addEventListener('change', function () {
            var preview = document.getElementById('preview-imagen');
            if (this.files.length > 0) {
                preview.src = URL.createObjectURL(this.files[0]);
                preview.style.display = 'block';
            } else {
                preview.src = '';
                preview.style.display = 'none';
            }
        });

        function mostrarMensaje(idDiv, texto) {
            var div = document.getElementById(idDiv);
            div.textContent = texto;
            div.style.display = 'block';
            setTimeout(function () { div.style.display = 'none'; }, 3000);
        }
    </script>

</body>
</html>
