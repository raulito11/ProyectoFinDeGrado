<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - El Olivo Admin</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <nav>
        <span>El Olivo - Admin</span>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="reservas.html">Reservas</a></li>
            <li><a href="usuarios.html">Usuarios</a></li>
            <li><a href="carta.html">Carta</a></li>
            <li><a href="horarios.html">Horarios</a></li>
            <li><a href="cierres.html">Cierres</a></li>
            <li><a href="#" onclick="cerrarSesion()">Cerrar sesion</a></li>
        </ul>
    </nav>

    <main>
        <h2>Dashboard</h2>

        <!-- Tarjetas KPI -->
        <div id="kpi-contenedor" style="display: flex; gap: 16px; margin-bottom: 30px; flex-wrap: wrap;">
            <!-- Se generan desde JS -->
        </div>

        <!-- Tabla de aforo del dia -->
        <h2>Aforo del dia</h2>
        <table id="tabla-aforo" style="display: none;">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Ocupado</th>
                    <th>Disponible</th>
                    <th>% Ocupacion</th>
                </tr>
            </thead>
            <tbody id="cuerpo-aforo">
                <!-- Filas generadas desde JS -->
            </tbody>
        </table>

        <p id="sin-aforo" style="display: none; color: #666;">No hay datos de aforo para hoy.</p>
    </main>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/admin.js"></script>

    <script>
        (async function () {
            var usuario = await checkSession();
            if (!usuario) return;

            usuarioEnSesion = usuario;

            cargarDashboard();
        })();
    </script>

</body>
</html>
