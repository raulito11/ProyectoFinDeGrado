<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadisticas - El Olivo Admin</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <nav id="navbar"></nav>

    <main>
        <h2>Estadisticas</h2>

        <!-- Tarjetas KPI -->
        <div id="kpi-contenedor" style="display: flex; gap: 16px; margin-bottom: 30px; flex-wrap: wrap;">
            <!-- Se generan desde JS -->
        </div>

        <!-- Tabla de aforo del dia -->
        <h2>Aforo del dia</h2>
        <table id="tabla-aforo" style="display: none;">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Ocupado</th>
                    <th>Disponible</th>
                    <th>% Ocupacion</th>
                </tr>
            </thead>
            <tbody id="cuerpo-aforo">
                <!-- Filas generadas desde JS -->
            </tbody>
        </table>

        <p id="sin-aforo" style="display: none; color: #666;">No hay datos de aforo para hoy.</p>
    </main>

    <footer class="footer">
        <p>&copy; 2025 El Olivo &middot; Restaurante &middot; Madrid</p>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/admin.js"></script>

    <script>
        checkSession().then(function (usuario) {
            if (!usuario) return;

            if (usuario.rol !== 'admin') {
                window.location.href = '/ProyectoFinDeGrado/frontend/index.html';
                return;
            }

            usuarioEnSesion = usuario;
            cargarDashboard();
        });
    </script>

</body>
</html>
