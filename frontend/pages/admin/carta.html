<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/ProyectoFinDeGrado/frontend/favicon.png">
    <title>Carta - El Olivo Admin</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <nav id="navbar"></nav>

    <main>

        <!-- SECCION CATEGORIAS -->
        <h2>Categorias</h2>

        <!-- Mensajes categorias -->
        <div id="mensaje-error-categorias" class="mensaje-error"></div>
        <div id="mensaje-exito-categorias" class="mensaje-exito"></div>

        <table id="tabla-categorias" style="display: none; margin-bottom: 24px;">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripcion</th>
                    <th>Activo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpo-categorias">
                <!-- Filas generadas desde JS -->
            </tbody>
        </table>

        <p id="sin-categorias" style="display: none; color: #666; margin-bottom: 24px;">No hay categorias creadas.</p>

        <div style="margin-bottom: 32px;">
            <a href="nueva_categoria.html" class="btn btn-verde">Anadir categoria</a>
        </div>

        <!-- SECCION PLATOS -->
        <h2>Platos</h2>

        <!-- Mensajes platos -->
        <div id="mensaje-error-platos" class="mensaje-error"></div>
        <div id="mensaje-exito-platos" class="mensaje-exito"></div>

        <table id="tabla-platos" style="display: none; margin-bottom: 24px;">
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Nombre</th>
                    <th>Categoria</th>
                    <th>Precio</th>
                    <th>Activo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpo-platos">
                <!-- Filas generadas desde JS -->
            </tbody>
        </table>

        <p id="sin-platos" style="display: none; color: #666; margin-bottom: 24px;">No hay platos en la carta.</p>

        <div style="margin-bottom: 32px;">
            <a href="nuevo_plato.html" class="btn btn-verde">Anadir plato</a>
        </div>

    </main>

    <footer class="footer">
        <p>&copy; 2025 El Olivo &middot; Restaurante &middot; Madrid</p>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/admin.js"></script>

    <script>
        checkSession().then(function (usuario) {
            if (!usuario) return;

            if (usuario.rol !== 'admin') {
                window.location.href = '/ProyectoFinDeGrado/frontend/index.html';
                return;
            }

            usuarioEnSesion = usuario;
            cargarCategorias();
            cargarPlatos();
        });

        // Sobreescribir mostrarTablaCategorias para incluir el boton Editar
        // (la version de admin.js no tiene la columna Acciones)
        mostrarTablaCategorias = function (categorias) {
            var tabla    = document.getElementById('tabla-categorias');
            var cuerpo   = document.getElementById('cuerpo-categorias');
            var sinDatos = document.getElementById('sin-categorias');

            if (!tabla || !cuerpo) return;

            cuerpo.innerHTML = '';

            if (!categorias || categorias.length === 0) {
                tabla.style.display    = 'none';
                sinDatos.style.display = 'block';
                return;
            }

            sinDatos.style.display = 'none';

            categorias.forEach(function (c) {
                var fila = document.createElement('tr');
                fila.innerHTML =
                    '<td>' + c.nombre + '</td>' +
                    '<td>' + (c.descripcion || '-') + '</td>' +
                    '<td>' + (c.activo ? 'Si' : 'No') + '</td>' +
                    '<td>' +
                        '<button class="btn btn-gris" ' +
                            'onclick="irAEditarCategoria(' + c.id_categoria + ')">Editar</button>' +
                    '</td>';
                cuerpo.appendChild(fila);
            });

            tabla.style.display = 'table';
        };

        // Guarda el id en sessionStorage y navega a la pagina de edicion
        function irAEditarCategoria(idCategoria) {
            sessionStorage.setItem('idCategoriaEditar', idCategoria);
            window.location.href = 'nueva_categoria.html';
        }
    </script>

</body>
</html>
