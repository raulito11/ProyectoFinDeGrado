<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/ProyectoFinDeGrado/frontend/favicon.png">
    <title>Categoría — El Olivo Admin</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <nav id="navbar" class="nav"></nav>

    <header class="page-header">
        <div class="page-header-inner">
            <div>
                <div class="eyebrow">Administración · Carta</div>
                <h1 class="display" id="titulo-pagina">Nueva categoría</h1>
            </div>
            <div class="page-actions">
                <a href="carta.html" class="btn btn-secondary btn-sm">← Volver a la carta</a>
            </div>
        </div>
    </header>

    <main class="page-main" style="max-width:560px;">

        <div id="mensaje-error" class="mensaje-error"></div>
        <div id="mensaje-exito" class="mensaje-exito"></div>

        <div class="card card-body col gap-4">
            <div class="field">
                <label>Nombre</label>
                <input type="text" id="campo-nombre" placeholder="Nombre de la categoría">
            </div>
            <div class="field">
                <label>Descripción <span style="font-weight:400; text-transform:none; letter-spacing:0; color:var(--ink-3);">(opcional)</span></label>
                <input type="text" id="campo-descripcion" placeholder="Descripción opcional">
            </div>
            <div class="field">
                <label>Orden en la carta</label>
                <input type="number" id="campo-orden" placeholder="0" min="0" value="0">
            </div>
            <div class="row gap-2">
                <button class="btn btn-primary" id="btn-guardar" onclick="guardarCategoria()">Añadir categoría</button>
                <a href="carta.html" class="btn btn-ghost">Cancelar</a>
            </div>
        </div>

    </main>

    <footer class="footer">
        <span>&copy; 2025 El Olivo · Madrid</span>
        <span class="mono" style="font-size:11px;">Cocina mediterránea</span>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>

    <script>
        var idCategoria = null;

        checkSession().then(function (usuario) {
            if (!usuario) return;
            if (usuario.rol !== 'admin') {
                window.location.href = '/ProyectoFinDeGrado/frontend/index.html';
                return;
            }
            idCategoria = sessionStorage.getItem('idCategoriaEditar');
            sessionStorage.removeItem('idCategoriaEditar');
            if (idCategoria) {
                document.getElementById('titulo-pagina').textContent = 'Editar categoría';
                document.getElementById('btn-guardar').textContent   = 'Guardar cambios';
                cargarCategoria(idCategoria);
            }
        });

        function cargarCategoria(id) {
            fetchAPI('/ProyectoFinDeGrado/backend/carta/listar_categorias.php')
                .then(function (respuesta) {
                    if (!respuesta.success) return;
                    var categoria = null;
                    respuesta.data.forEach(function (c) { if (c.id_categoria == id) categoria = c; });
                    if (!categoria) { window.location.href = 'carta.html'; return; }
                    document.getElementById('campo-nombre').value      = categoria.nombre;
                    document.getElementById('campo-descripcion').value = categoria.descripcion || '';
                    document.getElementById('campo-orden').value       = categoria.orden || 0;
                });
        }

        function guardarCategoria() {
            var nombre      = document.getElementById('campo-nombre').value.trim();
            var descripcion = document.getElementById('campo-descripcion').value.trim();
            var orden       = document.getElementById('campo-orden').value;

            if (!nombre) {
                mostrarMensaje('mensaje-error', 'El nombre de la categoría es obligatorio.');
                return;
            }

            var url = idCategoria
                ? '/ProyectoFinDeGrado/backend/carta/modificar_categoria.php'
                : '/ProyectoFinDeGrado/backend/carta/crear_categoria.php';

            var payload = { nombre: nombre, descripcion: descripcion, orden: parseInt(orden) };
            if (idCategoria) payload.id_categoria = parseInt(idCategoria);

            fetchAPI(url, 'POST', payload)
                .then(function (respuesta) {
                    if (!respuesta.success) {
                        mostrarMensaje('mensaje-error', respuesta.message || 'Error al guardar la categoría.');
                        return;
                    }
                    var msg = idCategoria ? 'Categoría actualizada correctamente.' : 'Categoría creada correctamente.';
                    mostrarMensaje('mensaje-exito', msg + ' Volviendo...');
                    setTimeout(function () { window.location.href = 'carta.html'; }, 1500);
                })
                .catch(function () { mostrarMensaje('mensaje-error', 'Error de conexión con el servidor.'); });
        }

        function mostrarMensaje(idDiv, texto) {
            var div = document.getElementById(idDiv);
            div.textContent = texto;
            div.style.display = 'block';
            setTimeout(function () { div.style.display = 'none'; }, 3000);
        }
    </script>

</body>
</html>
