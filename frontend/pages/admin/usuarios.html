<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/ProyectoFinDeGrado/frontend/favicon.png">
    <title>Usuarios — El Olivo Admin</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <nav id="navbar" class="nav"></nav>

    <header class="page-header">
        <div class="page-header-inner">
            <div>
                <div class="eyebrow">Administración · Usuarios</div>
                <h1 class="display">Gestión de usuarios</h1>
                <p class="subtitle">Crea, edita o elimina cuentas de clientes y empleados.</p>
            </div>
        </div>
    </header>

    <main class="page-main">

        <!-- Mensajes -->
        <div id="mensaje-error-usuarios" class="mensaje-error"></div>
        <div id="mensaje-exito-usuarios" class="mensaje-exito"></div>

        <!-- Tabla -->
        <div class="card" style="margin-bottom:24px;">
            <p id="sin-usuarios" style="display:none; padding:28px; color:var(--ink-3); font-size:13px;">No hay usuarios registrados.</p>
            <table id="tabla-usuarios" class="tbl" style="display:none;">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Rol</th>
                        <th style="text-align:right;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-usuarios"></tbody>
            </table>
        </div>

        <!-- Formulario -->
        <div class="card card-body">
            <input type="hidden" id="id-usuario-editar" value="">

            <div class="eyebrow" id="titulo-formulario-usuario" style="margin-bottom:20px;">Nuevo usuario</div>

            <div class="col gap-4">
                <div class="row gap-3">
                    <div class="field" style="flex:1;">
                        <label>Nombre</label>
                        <input type="text" id="campo-nombre" placeholder="Nombre">
                    </div>
                    <div class="field" style="flex:1;">
                        <label>Apellidos</label>
                        <input type="text" id="campo-apellidos" placeholder="Apellidos">
                    </div>
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="campo-email" placeholder="email@ejemplo.com">
                </div>
                <div class="field">
                    <label>Contraseña <span id="label-password-opcional" style="font-weight:400; text-transform:none; letter-spacing:0; color:var(--ink-3);">(dejar en blanco para no cambiar)</span></label>
                    <input type="password" id="campo-password" placeholder="Contraseña">
                </div>
                <div class="row gap-3">
                    <div class="field" style="flex:1;">
                        <label>Teléfono</label>
                        <input type="tel" id="campo-telefono" placeholder="600000000">
                    </div>
                    <div class="field" style="flex:1;">
                        <label>Rol</label>
                        <select id="campo-rol"></select>
                    </div>
                </div>
                <div class="row gap-2">
                    <button class="btn btn-primary" id="btn-guardar-usuario" onclick="guardarUsuario()">Crear usuario</button>
                    <button class="btn btn-ghost" id="btn-cancelar-usuario" style="display:none;" onclick="cancelarEdicionUsuario()">Cancelar</button>
                </div>
            </div>
        </div>

    </main>

    <footer class="footer">
        <span>&copy; 2025 El Olivo · Madrid</span>
        <span class="mono" style="font-size:11px;">Cocina mediterránea</span>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/admin.js"></script>

    <script>
        checkSession().then(function (usuario) {
            if (!usuario) return;
            if (usuario.rol !== 'admin') {
                window.location.href = '/ProyectoFinDeGrado/frontend/index.html';
                return;
            }
            usuarioEnSesion = usuario;
            cargarUsuarios();
        });
    </script>

</body>
</html>
