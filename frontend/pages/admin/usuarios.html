<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Usuarios — Los Olivos Admin</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <nav id="navbar" class="nav"></nav>

    <header class="page-header">
        <div class="page-header-inner">
            <div>
                <div class="eyebrow">Administración Usuarios</div>
                <h1 class="display">Gestión de usuarios</h1>
                <p class="subtitle">Crea, edita o elimina cuentas de clientes y empleados.</p>
            </div>
            <div class="page-actions">
                <a href="crear_usuario.html" class="btn btn-primary btn-sm">+ Crear usuario</a>
            </div>
        </div>
    </header>

    <main class="page-main">

        <!-- Mensajes -->
        <div id="mensaje-error-usuarios" class="mensaje-error"></div>
        <div id="mensaje-exito-usuarios" class="mensaje-exito"></div>

        <!-- Tabla -->
        <div class="card">
            <p id="sin-usuarios" style="display:none; padding:28px; color:var(--ink-3); font-size:13px;">No hay usuarios registrados.</p>
            <table id="tabla-usuarios" class="tbl" style="display:none;">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Rol</th>
                        <th style="text-align:right;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-usuarios"></tbody>
            </table>
        </div>

    </main>

    <footer class="footer">
        <span>&copy; 2026 Los Olivos Madrid</span>
        <span class="mono" style="font-size:11px;">Cocina mediterránea</span>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/admin.js"></script>

    <script>
        checkSession().then(function (usuario) {
            if (!usuario) return;
            if (usuario.rol !== 'admin') {
                window.location.href = '/index.html';
                return;
            }
            usuarioEnSesion = usuario;
            cargarUsuarios();
        });
    </script>

</body>
</html>
