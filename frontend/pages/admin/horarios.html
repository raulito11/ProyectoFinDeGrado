<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/ProyectoFinDeGrado/frontend/favicon.png">
    <title>Horarios de trabajadores — Los Olivos Admin</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .celda-dia          { text-align:center; padding:6px 4px !important; transition:background-color .15s; }
        .dia-trabajo        { background-color: color-mix(in oklch, var(--ok) 18%, var(--bg-elev)) !important; }
        .dia-libre          { background-color: color-mix(in oklch, var(--ink-3) 14%, var(--bg-elev)) !important; }
        .celda-dia select   { border:none; background:transparent; font-size:12px; font-weight:600;
                              cursor:pointer; width:100%; text-align:center; }
        #tabla-htrab th     { white-space:nowrap; }
        #tabla-htrab th small { font-weight:400; font-size:10px; display:block; }
    </style>
</head>
<body>

    <nav id="navbar" class="nav"></nav>

    <header class="page-header">
        <div class="page-header-inner">
            <div>
                <div class="eyebrow">Administración Personal</div>
                <h1 class="display">Horarios de trabajadores</h1>
                <p class="subtitle">Asigna manualmente los días de trabajo y descanso de cada empleado para la semana seleccionada.</p>
            </div>
        </div>
    </header>

    <main class="page-main">

        <!-- Navegador de semana -->
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap;">
            <button class="btn btn-ghost btn-sm" onclick="cambiarSemanaHtrab(-1)">&#8592; Semana anterior</button>
            <span id="htrab-semana-label" class="mono" style="font-size:14px; font-weight:600;"></span>
            <button class="btn btn-ghost btn-sm" onclick="cambiarSemanaHtrab(1)">Semana siguiente &#8594;</button>
            <button class="btn btn-olive btn-sm" style="margin-left:auto;" onclick="guardarSemanaHtrab()">Guardar semana</button>
        </div>

        <div id="mensaje-error-htrab" class="mensaje-error"></div>
        <div id="mensaje-exito-htrab" class="mensaje-exito"></div>

        <div class="card">
            <p id="sin-htrab" style="display:none; color:var(--ink-3); font-size:13px;">No hay trabajadores registrados.</p>
            <table id="tabla-htrab" class="tbl" style="display:none;">
                <thead id="cabecera-htrab"></thead>
                <tbody id="cuerpo-htrab"></tbody>
            </table>
        </div>

    </main>

    <footer class="footer">
        <span>&copy; 2026 Los Olivos Madrid</span>
        <span class="mono" style="font-size:11px;">Cocina mediterránea</span>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/admin.js"></script>

    <script>
        checkSession().then(function (usuario) {
            if (!usuario) return;
            if (usuario.rol !== 'admin') {
                window.location.href = '/ProyectoFinDeGrado/frontend/index.html';
                return;
            }
            usuarioEnSesion = usuario;
            iniciarSeccionHtrab();
        });
    </script>

</body>
</html>
