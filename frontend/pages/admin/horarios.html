<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios - El Olivo Admin</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <nav>
        <span>El Olivo - Admin</span>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="reservas.html">Reservas</a></li>
            <li><a href="usuarios.html">Usuarios</a></li>
            <li><a href="carta.html">Carta</a></li>
            <li><a href="horarios.html">Horarios</a></li>
            <li><a href="cierres.html">Cierres</a></li>
            <li><a href="#" onclick="cerrarSesion()">Cerrar sesion</a></li>
        </ul>
    </nav>

    <main>
        <h2>Gestion de horarios</h2>

        <!-- Aviso importante -->
        <div style="background-color: #fff8e1; border: 1px solid #e67e22; border-radius: 6px; padding: 12px 16px; margin-bottom: 24px; color: #7d4e00;">
            Atencion: Modificar los horarios activos puede afectar a la creacion de nuevas reservas.
        </div>

        <!-- Mensajes -->
        <div id="mensaje-error-horarios" class="mensaje-error"></div>
        <div id="mensaje-exito-horarios" class="mensaje-exito"></div>

        <!-- Tabla de horarios -->
        <table id="tabla-horarios" style="display: none;">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Estado</th>
                    <th>Accion</th>
                </tr>
            </thead>
            <tbody id="cuerpo-horarios">
                <!-- Filas generadas desde JS -->
            </tbody>
        </table>

        <p id="sin-horarios" style="display: none; color: #666;">No hay horarios configurados.</p>
    </main>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/admin.js"></script>

    <script>
        (async function () {
            var usuario = await checkSession();
            if (!usuario) return;

            usuarioEnSesion = usuario;

            cargarHorarios();
        })();
    </script>

</body>
</html>
