<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/ProyectoFinDeGrado/frontend/favicon.png">
    <title>Cierres — Los Olivos Admin</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <nav id="navbar" class="nav"></nav>

    <header class="page-header">
        <div class="page-header-inner">
            <div>
                <div class="eyebrow">Administración Configuración</div>
                <h1 class="display">Días cerrados</h1>
                <p class="subtitle">Los días marcados como cerrados no permiten nuevas reservas.</p>
            </div>
        </div>
    </header>

    <main class="page-main">

        <!-- Formulario nuevo cierre -->
        <div class="card card-body" style="margin-bottom:22px;">
            <div class="eyebrow" style="margin-bottom:16px;">Añadir día cerrado</div>
            <div class="row gap-3" style="align-items:flex-end; flex-wrap:wrap;">
                <div class="field">
                    <label>Fecha</label>
                    <input type="date" id="campo-fecha-cierre" style="width:180px;">
                </div>
                <div class="field" style="flex:1; min-width:180px;">
                    <label>Motivo</label>
                    <input type="text" id="campo-motivo-cierre" placeholder="Ej: Navidad, Reformas...">
                </div>
                <button class="btn btn-primary" onclick="crearCierre()">Añadir cierre</button>
            </div>
        </div>

        <!-- Mensajes -->
        <div id="mensaje-error-cierres" class="mensaje-error"></div>
        <div id="mensaje-exito-cierres" class="mensaje-exito"></div>

        <!-- Tabla -->
        <p id="sin-cierres" style="display:none; color:var(--ink-3); font-size:13px;">No hay días cerrados registrados.</p>

        <div class="card">
            <table id="tabla-cierres" class="tbl" style="display:none;">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Motivo</th>
                        <th style="text-align:right;">Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-cierres"></tbody>
            </table>
        </div>

    </main>

    <footer class="footer">
        <span>&copy; 2026 Los Olivos Madrid</span>
        <span class="mono" style="font-size:11px;">Cocina mediterránea</span>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/admin.js"></script>

    <script>
        checkSession().then(function (usuario) {
            if (!usuario) return;
            if (usuario.rol !== 'admin') {
                window.location.href = '/ProyectoFinDeGrado/frontend/index.html';
                return;
            }
            usuarioEnSesion = usuario;
            cargarCierres();
        });
    </script>

</body>
</html>
