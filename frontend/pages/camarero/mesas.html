<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/ProyectoFinDeGrado/frontend/favicon.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Mesas del dia - El Olivo</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .filtro-fecha {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: white;
            padding: 16px 20px;
            border: 1px solid var(--borde);
            border-radius: 8px;
            margin-bottom: 24px;
        }
        .filtro-fecha label { font-weight: bold; color: #444; white-space: nowrap; }
        .filtro-fecha input[type="date"] { padding: 8px 12px; border: 1px solid var(--borde); border-radius: 5px; font-size: 0.95rem; }
        .filtro-fecha input[type="date"]:focus { outline: none; border-color: var(--verde); }
        .sin-asignar { color: #999; font-style: italic; }
        .numero-mesa { font-weight: bold; color: #2c6e49; }
        .mi-mesa { background-color: #eaf7f0; }
    </style>
</head>
<body>

    <nav id="navbar"></nav>

    <main>
        <section class="seccion-landing">
            <h2>Mesas del dia</h2>

            <div class="filtro-fecha">
                <label for="input-fecha">Fecha:</label>
                <input type="date" id="input-fecha" onchange="cambiarFecha()">
            </div>

            <div id="mensaje-error-mesas" class="mensaje-error"></div>

            <table id="tabla-mesas" style="display: none;">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Hora</th>
                        <th>Personas</th>
                        <th>Estado</th>
                        <th>Mesa</th>
                        <th>Camarero</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-mesas"></tbody>
            </table>

            <p id="sin-mesas" style="display: none; color: #666;">No hay reservas para este dia.</p>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 El Olivo &middot; Restaurante &middot; Madrid</p>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/empleados.js"></script>

    <script>
        var idUsuarioActual = null;

        checkSession().then(function (usuario) {
            if (!usuario) return;

            if (usuario.rol !== 'camarero') {
                window.location.href = '/ProyectoFinDeGrado/frontend/index.html';
                return;
            }

            idUsuarioActual = usuario.id;

            var inputFecha = document.getElementById('input-fecha');
            inputFecha.value = obtenerFechaHoy();
            cargarPaginaMesas(inputFecha.value);
        });

        function cargarPaginaMesas(fecha) {
            cargarAsignaciones(fecha).then(function (reservas) {
                if (reservas === null) {
                    mostrarMensaje('mensaje-error-mesas', 'No se han podido cargar los datos. Intentalo de nuevo.');
                    return;
                }
                mostrarAsignacionesCamarero(reservas);
            });
        }

        function cambiarFecha() {
            var fecha = document.getElementById('input-fecha').value;
            if (!fecha) return;
            cargarPaginaMesas(fecha);
        }

        function mostrarAsignacionesCamarero(reservas) {
            var tabla    = document.getElementById('tabla-mesas');
            var cuerpo   = document.getElementById('cuerpo-mesas');
            var sinDatos = document.getElementById('sin-mesas');

            cuerpo.innerHTML = '';

            if (!reservas || reservas.length === 0) {
                tabla.style.display    = 'none';
                sinDatos.style.display = 'block';
                return;
            }

            sinDatos.style.display = 'none';

            reservas.forEach(function (r) {
                var claseEstado = 'estado-' + r.estado;
                var horaInicio  = formatearHora(r.hora_inicio);
                var horaFin     = formatearHora(r.hora_fin);

                var celdaMesa = r.numero_mesa
                    ? '<span class="numero-mesa">' + r.numero_mesa + '</span>'
                    : '<span class="sin-asignar">Sin asignar</span>';

                var celdaCamarero = r.nombre_camarero
                    ? r.nombre_camarero + ' ' + r.apellidos_camarero
                    : '<span class="sin-asignar">Sin asignar</span>';

                var fila = document.createElement('tr');

                // resaltar filas asignadas a este camarero
                if (r.id_camarero && r.id_camarero == idUsuarioActual) {
                    fila.classList.add('mi-mesa');
                }

                fila.innerHTML =
                    '<td>' + r.nombre + ' ' + r.apellidos + '</td>' +
                    '<td>' + horaInicio + ' - ' + horaFin + '</td>' +
                    '<td>' + r.num_personas + '</td>' +
                    '<td><span class="' + claseEstado + '">' + r.estado + '</span></td>' +
                    '<td>' + celdaMesa + '</td>' +
                    '<td>' + celdaCamarero + '</td>';

                cuerpo.appendChild(fila);
            });

            tabla.style.display = 'table';
        }
    </script>

</body>
</html>
