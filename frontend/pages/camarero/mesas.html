<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Mesas del día — Los Olivos</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .sin-asignar  { color:var(--ink-3); font-style:italic; }
        .numero-mesa  { font-family:var(--mono); font-weight:600; color:var(--olivo); }
        .mi-mesa td   { background-color: color-mix(in oklch, var(--olivo) 6%, var(--bg-elev)) !important; }
    </style>
</head>
<body>

    <nav id="navbar" class="nav"></nav>

    <header class="page-header">
        <div class="page-header-inner">
            <div>
                <div class="eyebrow">Camarero Los Olivos</div>
                <h1 class="display">Mesas del día</h1>
            </div>
        </div>
    </header>

    <main class="page-main">

        <div class="card card-body row gap-3" style="align-items:center; margin-bottom:22px; width:fit-content;">
            <label class="label" style="white-space:nowrap;">Fecha:</label>
            <input type="date" id="input-fecha" onchange="cambiarFecha()" style="width:180px;">
        </div>

        <div id="mensaje-error-mesas" class="mensaje-error"></div>
        <p id="sin-mesas" style="display:none; color:var(--ink-3); font-size:13px;">No hay reservas para este día.</p>

        <div class="card">
            <table id="tabla-mesas" class="tbl" style="display:none;">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Hora</th>
                        <th>Personas</th>
                        <th>Estado</th>
                        <th>Mesa</th>
                        <th>Camarero</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-mesas"></tbody>
            </table>
        </div>

    </main>

    <footer class="footer">
        <span>&copy; 2026 Los Olivos Madrid</span>
        <span class="mono" style="font-size:11px;">Cocina mediterránea</span>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/empleados.js"></script>

    <script>
        var idUsuarioActual = null;

        checkSession().then(function (usuario) {
            if (!usuario) return;
            if (usuario.rol !== 'camarero') {
                window.location.href = '/index.html';
                return;
            }
            idUsuarioActual = usuario.id;
            var inputFecha = document.getElementById('input-fecha');
            inputFecha.value = obtenerFechaHoy();
            cargarPaginaMesas(inputFecha.value);
        });

        function cargarPaginaMesas(fecha) {
            cargarAsignaciones(fecha).then(function (reservas) {
                if (reservas === null) {
                    mostrarMensaje('mensaje-error-mesas', 'No se han podido cargar los datos. Inténtalo de nuevo.');
                    return;
                }
                mostrarAsignacionesCamarero(reservas);
            });
        }

        function cambiarFecha() {
            var fecha = document.getElementById('input-fecha').value;
            if (!fecha) return;
            cargarPaginaMesas(fecha);
        }

        function mostrarAsignacionesCamarero(reservas) {
            var tabla    = document.getElementById('tabla-mesas');
            var cuerpo   = document.getElementById('cuerpo-mesas');
            var sinDatos = document.getElementById('sin-mesas');
            cuerpo.innerHTML = '';
            if (!reservas || reservas.length === 0) {
                tabla.style.display    = 'none';
                sinDatos.style.display = 'block';
                return;
            }
            sinDatos.style.display = 'none';
            reservas.forEach(function (r) {
                var estadoBadge = estadoABadge(r.estado);
                var horaInicio  = formatearHora(r.hora_inicio);
                var horaFin     = formatearHora(r.hora_fin);
                var celdaMesa   = r.numero_mesa
                    ? '<span class="numero-mesa">' + r.numero_mesa + '</span>'
                    : '<span class="sin-asignar">Sin asignar</span>';
                var celdaCamarero = r.nombre_camarero
                    ? r.nombre_camarero + ' ' + r.apellidos_camarero
                    : '<span class="sin-asignar">Sin asignar</span>';
                var fila = document.createElement('tr');
                if (r.id_camarero && r.id_camarero == idUsuarioActual) fila.classList.add('mi-mesa');
                fila.innerHTML =
                    '<td style="font-weight:500;">' + r.nombre + ' ' + r.apellidos + '</td>' +
                    '<td class="num">' + horaInicio + ' — ' + horaFin + '</td>' +
                    '<td class="num">' + r.num_personas + '</td>' +
                    '<td>' + estadoBadge + '</td>' +
                    '<td>' + celdaMesa + '</td>' +
                    '<td>' + celdaCamarero + '</td>';
                cuerpo.appendChild(fila);
            });
            tabla.style.display = 'table';
        }

        function estadoABadge(estado) {
            var mapa = { confirmada: 'badge-ok', pendiente: 'badge-warn', cancelada: 'badge-err' };
            var cls = mapa[estado] || 'badge-mute';
            return '<span class="badge ' + cls + '"><span class="dot"></span>' + estado + '</span>';
        }
    </script>

</body>
</html>
