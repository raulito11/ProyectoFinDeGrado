<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Iniciar sesión — Los Olivos</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body style="display:block; background:var(--bg);">

    <div class="auth-page">

        <!-- Lado foto -->
        <div class="auth-foto">
            <div class="row gap-3" style="align-items:center;">
                <div class="brand-mark" style="background:#fff; color:var(--olivo);">O</div>
                <span class="brand-nombre">Los Olivos</span>
            </div>
            <div>
                <p class="auth-cita">"La mesa estará puesta cuando llegues."</p>
                <div class="auth-cita-sub">— EQUIPO DE SALA</div>
            </div>
        </div>

        <!-- Lado formulario -->
        <div class="auth-form-side">
            <div class="auth-top-links">
                <a href="/index.html">← VOLVER AL INICIO</a>
                <a href="registro.html">¿NUEVO AQUÍ? <span class="link" style="color:var(--ink);">CREAR CUENTA</span></a>
            </div>

            <div class="auth-form-inner">
                <div class="eyebrow" style="margin-bottom:12px;">Sistema de reservas</div>
                <h1>Bienvenido de nuevo.</h1>
                <p class="subtitle">Accede a tu cuenta para gestionar tus reservas.</p>

                <div id="mensaje-error" class="mensaje-error"></div>

                <form id="form-login" class="col gap-4">
                    <div class="field">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                    </div>
                    <div class="field">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg" style="justify-content:center; margin-top:8px;">Entrar</button>
                </form>

                <div class="row gap-3 center" style="margin-top:24px;">
                    <div class="rule grow"></div>
                    <span class="mono" style="font-size:10px; letter-spacing:.14em; color:var(--ink-3);">O</span>
                    <div class="rule grow"></div>
                </div>
                <p style="font-size:13px; color:var(--ink-2); text-align:center; margin-top:16px;">
                    ¿Aún no tienes cuenta? <a href="registro.html" class="link" style="color:var(--ink);">Regístrate aquí</a>
                </p>
            </div>
        </div>

    </div>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>

</body>
</html>
