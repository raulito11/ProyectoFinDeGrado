<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Mesas del día — Los Olivos</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .sin-asignar { color:var(--ink-3); font-style:italic; }
        .numero-mesa { font-family:var(--mono); font-weight:600; color:var(--olivo); }

        /* Modal */
        .modal-fondo {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:oklch(0.20 0.015 80 / .5); z-index:200;
        }
        .modal-caja {
            background:var(--bg-elev); border:1px solid var(--line);
            border-radius:var(--r-lg); padding:32px; max-width:420px; margin:10% auto;
            box-shadow:var(--shadow-2);
        }
        .modal-caja h3 { font-family:var(--display); font-size:22px; margin-bottom:16px; font-weight:500; }
        .modal-caja p  { margin-bottom:16px; color:var(--ink-2); font-size:13px; }
        .modal-botones { margin-top:20px; display:flex; gap:12px; }
    </style>
</head>
<body>

    <!-- Modal de asignación -->
    <div id="modal-asignar" class="modal-fondo">
        <div class="modal-caja">
            <h3>Asignar mesa y camarero</h3>
            <p id="modal-nombre-cliente"></p>

            <div class="col gap-4">
                <div class="field">
                    <label>Número de mesa</label>
                    <input type="number" id="input-numero-mesa" min="1" placeholder="Ej: 5">
                </div>
                <div class="field">
                    <label>Camarero</label>
                    <select id="select-camarero">
                        <option value="">— Sin asignar —</option>
                    </select>
                </div>
                <div id="modal-error" class="mensaje-error"></div>
                <div class="modal-botones">
                    <button id="btn-confirmar-mesa" class="btn btn-primary">Confirmar</button>
                    <button onclick="cerrarModal()" class="btn btn-ghost">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <nav id="navbar" class="nav"></nav>

    <header class="page-header">
        <div class="page-header-inner">
            <div>
                <div class="eyebrow">Jefe de sala Los Olivos</div>
                <h1 class="display">Mesas del día</h1>
            </div>
        </div>
    </header>

    <main class="page-main">

        <div class="card card-body row gap-3" style="align-items:center; margin-bottom:22px; width:fit-content;">
            <label class="label" style="white-space:nowrap;">Fecha:</label>
            <input type="date" id="input-fecha" onchange="cambiarFecha()" style="width:180px;">
        </div>

        <div id="mensaje-error-mesas" class="mensaje-error"></div>
        <p id="sin-mesas" style="display:none; color:var(--ink-3); font-size:13px;">No hay reservas para este día.</p>

        <div class="card">
            <table id="tabla-mesas" class="tbl" style="display:none;">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Hora</th>
                        <th>Personas</th>
                        <th>Estado</th>
                        <th>Mesa</th>
                        <th>Camarero</th>
                        <th style="text-align:right;">Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-mesas"></tbody>
            </table>
        </div>

    </main>

    <footer class="footer">
        <span>&copy; 2026 Los Olivos Madrid</span>
        <span class="mono" style="font-size:11px;">Cocina mediterránea</span>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/empleados.js"></script>

    <script>
        var idReservaSeleccionada = null;

        checkSession().then(function (usuario) {
            if (!usuario) return;
            if (usuario.rol !== 'jefe_sala') {
                window.location.href = '/index.html';
                return;
            }
            cargarListaCamareros();
            var inputFecha = document.getElementById('input-fecha');
            inputFecha.value = obtenerFechaHoy();
            cargarPaginaMesas(inputFecha.value);
        });

        function cargarListaCamareros() {
            fetchAPI('empleados/listar_camareros.php')
                .then(function (respuesta) {
                    if (!respuesta.success) return;
                    var select = document.getElementById('select-camarero');
                    respuesta.camareros.forEach(function (c) {
                        var option = document.createElement('option');
                        option.value = c.id_usuario;
                        option.textContent = c.nombre + ' ' + c.apellidos;
                        select.appendChild(option);
                    });
                });
        }

        function cargarPaginaMesas(fecha) {
            cargarAsignaciones(fecha).then(function (reservas) {
                if (reservas === null) {
                    mostrarMensaje('mensaje-error-mesas', 'No se han podido cargar los datos. Inténtalo de nuevo.');
                    return;
                }
                mostrarAsignacionesJefe(reservas);
            });
        }

        function cambiarFecha() {
            var fecha = document.getElementById('input-fecha').value;
            if (!fecha) return;
            cargarPaginaMesas(fecha);
        }

        function estadoABadge(estado) {
            var mapa = { confirmada: 'badge-ok', pendiente: 'badge-warn', cancelada: 'badge-err' };
            var cls = mapa[estado] || 'badge-mute';
            return '<span class="badge ' + cls + '"><span class="dot"></span>' + estado + '</span>';
        }

        function mostrarAsignacionesJefe(reservas) {
            var tabla    = document.getElementById('tabla-mesas');
            var cuerpo   = document.getElementById('cuerpo-mesas');
            var sinDatos = document.getElementById('sin-mesas');
            cuerpo.innerHTML = '';
            if (!reservas || reservas.length === 0) {
                tabla.style.display    = 'none';
                sinDatos.style.display = 'block';
                return;
            }
            sinDatos.style.display = 'none';
            reservas.forEach(function (r) {
                var horaInicio     = formatearHora(r.hora_inicio);
                var horaFin        = formatearHora(r.hora_fin);
                var nombreCompleto = r.nombre + ' ' + r.apellidos;
                var celdaMesa = r.numero_mesa
                    ? '<span class="numero-mesa">' + r.numero_mesa + '</span>'
                    : '<span class="sin-asignar">Sin asignar</span>';
                var celdaCamarero = r.nombre_camarero
                    ? r.nombre_camarero + ' ' + r.apellidos_camarero
                    : '<span class="sin-asignar">Sin asignar</span>';
                var celdaAccion;
                if (r.estado === 'cancelada') {
                    celdaAccion = '<span class="cell-mute" style="font-size:12px;">—</span>';
                } else if (r.numero_mesa) {
                    celdaAccion = '<button class="btn btn-ghost btn-sm" onclick="abrirModal(' + r.id_reserva + ',\'' + nombreCompleto.replace(/'/g,"\\'") + '\',' + (r.numero_mesa||0) + ',' + (r.id_camarero||0) + ')">Reasignar</button>';
                } else {
                    celdaAccion = '<button class="btn btn-olive btn-sm" onclick="abrirModal(' + r.id_reserva + ',\'' + nombreCompleto.replace(/'/g,"\\'") + '\',0,0)">Asignar</button>';
                }
                var fila = document.createElement('tr');
                fila.innerHTML =
                    '<td style="font-weight:500;">' + nombreCompleto + '</td>' +
                    '<td class="num">' + horaInicio + ' — ' + horaFin + '</td>' +
                    '<td class="num">' + r.num_personas + '</td>' +
                    '<td>' + estadoABadge(r.estado) + '</td>' +
                    '<td>' + celdaMesa + '</td>' +
                    '<td>' + celdaCamarero + '</td>' +
                    '<td style="text-align:right;">' + celdaAccion + '</td>';
                cuerpo.appendChild(fila);
            });
            tabla.style.display = 'table';
        }

        function abrirModal(idReserva, nombreCliente, mesaActual, camareroActual) {
            idReservaSeleccionada = idReserva;
            document.getElementById('modal-nombre-cliente').textContent = 'Cliente: ' + nombreCliente;
            document.getElementById('input-numero-mesa').value = mesaActual || '';
            document.getElementById('select-camarero').value  = camareroActual || '';
            document.getElementById('modal-error').style.display = 'none';
            document.getElementById('modal-asignar').style.display = 'block';
        }

        function cerrarModal() {
            document.getElementById('modal-asignar').style.display = 'none';
            idReservaSeleccionada = null;
        }

        document.getElementById('btn-confirmar-mesa').addEventListener('click', function () {
            var numeroMesa = parseInt(document.getElementById('input-numero-mesa').value, 10);
            var idCamarero = document.getElementById('select-camarero').value;
            var divError   = document.getElementById('modal-error');
            if (!numeroMesa || numeroMesa < 1) {
                divError.textContent = 'Introduce un número de mesa válido.';
                divError.style.display = 'block';
                return;
            }
            fetchAPI('empleados/asignar_mesa.php', 'POST', {
                id_reserva:  idReservaSeleccionada,
                numero_mesa: numeroMesa,
                id_camarero: idCamarero ? parseInt(idCamarero, 10) : null
            }).then(function (respuesta) {
                if (respuesta.success) {
                    cerrarModal();
                    cargarPaginaMesas(document.getElementById('input-fecha').value);
                } else {
                    divError.textContent = respuesta.message || 'No se ha podido asignar.';
                    divError.style.display = 'block';
                }
            });
        });
    </script>

</body>
</html>
