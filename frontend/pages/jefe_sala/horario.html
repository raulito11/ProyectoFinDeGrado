<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/ProyectoFinDeGrado/frontend/favicon.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Mi horario - El Olivo</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .fila-cierre { background-color: #fff3e0 !important; }
        .celda-cierre { text-align: center; color: #b45309; font-weight: bold; letter-spacing: 1px; }
        .fila-hoy td { background-color: #eaf7f0; }
    </style>
</head>
<body>

    <nav id="navbar"></nav>

    <main>
        <section class="seccion-landing">
            <h2>Mi horario semanal</h2>

            <div id="mensaje-error-horario" class="mensaje-error"></div>

            <table id="tabla-horario">
                <thead>
                    <tr>
                        <th>Dia</th>
                        <th>Fecha</th>
                        <th>Turno comida</th>
                        <th>Turno cena</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-horario"></tbody>
            </table>

            <p id="sin-horario" style="display: none; color: #666;">No hay datos de horario disponibles.</p>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 El Olivo &middot; Restaurante &middot; Madrid</p>
    </footer>

    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/empleados.js"></script>

    <script>
        checkSession().then(function (usuario) {
            if (!usuario) return;

            if (usuario.rol !== 'jefe_sala') {
                window.location.href = '/ProyectoFinDeGrado/frontend/index.html';
                return;
            }

            cargarHorarioSemanal().then(function (semana) {
                if (!semana) {
                    mostrarMensaje('mensaje-error-horario', 'No se ha podido cargar el horario. Intentalo de nuevo.');
                    return;
                }
                mostrarHorarioSemanal(semana);
                marcarDiaHoy();
            });
        });

        function marcarDiaHoy() {
            var hoy   = obtenerFechaHoy();
            var filas = document.querySelectorAll('#cuerpo-horario tr');
            filas.forEach(function (fila) {
                var celdaFecha = fila.cells[1];
                if (celdaFecha && celdaFecha.textContent.trim() === hoy) {
                    fila.classList.add('fila-hoy');
                }
            });
        }
    </script>

</body>
</html>
